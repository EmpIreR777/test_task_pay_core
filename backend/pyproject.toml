[project]
name = "payment_processing"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi>=0.135.3",
    "faststream[cli,rabbit]>=0.4.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.3.1",
    "respx>=0.21.0",
]
lint = [
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
    "ruff>=0.12.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = ".ruff_cache"


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "COM",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN003",
    "ANN401",
    "ARG001",
    "ARG005",
    "B008",
    "B904",
    "COM812",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = [
    "E402",
    "F401",
]
"backend/alembic/*" = [
    "E402",
    "F401",
]
"tests/*" = [
    "ANN",
    "S101",
    "S105",
    "S106",
]
"backend/tests/*" = [
    "ANN",
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
cache_dir = "$MYPY_CONFIG_FILE_DIR/.mypy_cache"
explicit_package_bases = true
strict = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
python_version = "3.13"
exclude = [
    "tests/",
    "alembic/",
]

[tool.codespell]
ignore-words-list = "selectin,ot"

[tool.pytest.ini_options]
testpaths = ['tests']
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
